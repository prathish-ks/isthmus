name: isthmus release

# P10-02 (Phase 11, Release Packaging): produces verifiable, checksummed,
# SBOM'd, keylessly-signed nanogo binaries for every supported platform.
# See go-host/docs/release-verification.md for how a user verifies what
# this workflow publishes, and go-host/docs/ADR-020-p10-01-minimum-trust-
# install.md for how go-host/scripts/install.sh consumes these artifacts.
#
# Formerly scoped to its own tag prefix (nanogo-v*), independent of any
# whole-project release — that separation assumed the Go kernel and the TS
# host could meaningfully drift apart. As of the enforcement-wiring work
# (EC-02), they can't: container-runner.ts's privileged operations call
# the kernel exclusively, with no TypeScript fallback, so a TS host without
# a matching current nanogo binary is non-functional, not "running in a
# degraded mode." Retargeted to isthmus-v* so one project-wide tag now
# triggers both the whole-project release and this binary build — see
# isthmus.sh, which installs the two together as a single entry point for
# exactly this reason. install.sh's own release lookup was updated to
# match (grep for isthmus-v, not nanogo-v).
on:
  push:
    tags:
      - "isthmus-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. isthmus-v1.0.0) — for a manual re-run, not normal use"
        required: true

permissions:
  contents: write # to create the GitHub release and upload assets
  id-token: write # for cosign's keyless signing (Sigstore/Fulcio via GitHub OIDC — no stored key)

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-host/go.mod

      - name: Build nanogo
        working-directory: go-host
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # modernc.org/sqlite is a pure-Go implementation specifically so
          # cross-compilation needs no C toolchain for the target platform
          # (see docs/baseline.md's rationale for that dependency choice).
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          out="dist/nanogo-${GOOS}-${GOARCH}"
          go build -mod=vendor -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "$out" ./cmd/nanogo
          chmod +x "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: nanogo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go-host/dist/*
          if-no-files-found: error

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # One SBOM for the module as built, not per-platform-binary — the Go
      # dependency graph a release actually ships is the same across every
      # GOOS/GOARCH combination (CGO_ENABLED=0, no per-platform deps), so a
      # single CycloneDX document naming go.mod's real, pinned dependency
      # set is accurate for every published binary, without generating and
      # publishing four near-identical copies of the same information.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: go-host
          format: cyclonedx-json
          output-file: nanogo-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: nanogo-sbom
          path: nanogo-sbom.cdx.json

  release:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        # download-artifact with no name filter pulls every artifact from
        # this run into dist/ (merge-multiple flattens the per-job
        # subdirectories) — the four platform binaries AND nanogo-sbom.cdx.json
        # land here together, so one SHA256SUMS covers everything this
        # release actually publishes, the SBOM included.
        run: |
          sha256sum nanogo-* > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Keyless-sign the checksum file
        working-directory: dist
        # Signs SHA256SUMS itself (not each binary individually) — anyone
        # who trusts SHA256SUMS.sig transitively trusts every binary it
        # lists, and this is exactly the same shape release-verification.md
        # asks a user to check. No private key anywhere in this repo or its
        # secrets: cosign's keyless mode signs using a short-lived
        # certificate issued to *this workflow run's own GitHub OIDC
        # identity* (Sigstore/Fulcio), which is what `cosign verify-blob
        # --certificate-identity`/`--certificate-oidc-issuer` checks against
        # on the consuming end — see release-verification.md.
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      # generate_release_notes is deliberately false: isthmus-v* releases
      # carry hand-written notes, authored and published separately from
      # this workflow (see isthmus-v1.0.0's own release for the current
      # convention — RELEASING.md and CHANGELOG.md are upstream NanoClaw's
      # own package.json/v* release process, unrelated to this tag scheme;
      # do not confuse the two). This step's only job is attaching build
      # artifacts to whatever release already exists for the tag (or
      # creating a bare one with just these files if none exists yet,
      # which a human then edits) — it must never generate or touch the
      # notes body itself.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/nanogo-darwin-*
            dist/nanogo-linux-*
            dist/nanogo-sbom.cdx.json
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
          generate_release_notes: false
