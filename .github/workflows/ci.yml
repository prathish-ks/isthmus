name: CI

on:
  pull_request:
    branches: [main]
  # P9-05 (Phase 9/10 hardening): the upstream-watch job below needs its own
  # trigger, independent of this repo's own PR cadence — a new nanocoai/
  # nanoclaw release can land on any day, PR or not. Weekly is deliberately
  # loose (this is a "time for a human to look" signal, not a build gate;
  # see docs/version-compatibility.md) with workflow_dispatch for an
  # on-demand check (e.g. right after a Discord/release announcement).
  schedule:
    - cron: "0 13 * * 1" # every Monday, 13:00 UTC
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Typecheck host uses a CI-only config (tsconfig.ci.json) that
      # excludes 3 files with pre-existing TypeScript errors (31 total,
      # all TS2783/TS2322 spread-then-explicit-property mismatches,
      # confirmed via a real `pnpm exec tsc --noEmit` run on 2026-09-03):
      # src/differential/fixtures.test.ts, fixtures-batch2.test.ts, and
      # fixtures-channel-registration.test.ts. These are not part of the
      # recorded upstream baseline (docs/baseline.md's P0-09 shows a
      # clean `tsc --noEmit` at v2.3.0) — they were introduced later by
      # this project's own differential-parity fixtures. This scopes the
      # CI gate around known, tracked debt rather than fixing or
      # silently widening it; the base tsconfig.json (and therefore
      # local/IDE type-checking) is untouched, so these errors stay
      # visible to anyone working in an editor or running
      # `pnpm exec tsc --noEmit` directly. See tsconfig.ci.json's own
      # header comment for the full rationale.
      - name: Typecheck host
        run: pnpm exec tsc -p tsconfig.ci.json --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      # Host tests uses a CI-only vitest config (vitest.config.ci.ts)
      # that excludes 2 files with pre-existing runtime test failures
      # (15 total), confirmed via a real `pnpm exec vitest run` run on
      # 2026-09-03 and matching docs/baseline.md's own recorded P0-09
      # baseline exactly (same 2 files, same 15 failures, already
      # documented there as upstream/environment-sensitive debt "not
      # investigated further per plan"):
      #   - scripts/add-dial-tool-scope.test.ts (11 failures)
      #   - scripts/update/transaction.e2e.test.ts (4 failures)
      # The base vitest.config.ts is untouched, so a local
      # `pnpm exec vitest run` still runs (and shows) these known-failing
      # tests by default. See vitest.config.ci.ts's own header comment
      # for the full rationale.
      - name: Host tests
        run: pnpm exec vitest run --config vitest.config.ci.ts

      - name: Container tests
        working-directory: container/agent-runner
        run: bun test

  # go-host (Phase 9/10, P9-01): standard Go CI checks — build, vet, test,
  # and the race detector — for the Go security kernel under go-host/. Kept
  # as a REQUIRED job (part of the `ci` gate below) because build/vet/test
  # failures here mean the trust kernel itself is broken, not a style nit.
  # Uses the checked-in vendor/ directory (`-mod=vendor`, matching every
  # `go build`/`go test` this project's own task close-outs have always run
  # by hand on the real Mac) so CI never depends on module-proxy
  # availability. Local equivalent, from go-host/:
  #   gofmt -l .
  #   go vet -mod=vendor ./...
  #   go build -mod=vendor ./...
  #   go test -mod=vendor ./... -v
  #   go test -mod=vendor -race ./...
  go-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod

      # gofmt check is scoped to this project's own files, excluding
      # vendor/. Vendored third-party sources are not expected to match
      # this repo's own gofmt formatting (confirmed here after the first
      # real CI run found genuine, pre-existing gofmt findings inside
      # vendor/github.com/google/uuid, vendor/github.com/mattn/go-isatty,
      # and vendor/github.com/remyoudompheng/bigfft) and this project does
      # not reformat code it does not own. go vet/build/test below already
      # only cover this project's own packages (module-mode "./..." never
      # expands into vendor/ regardless), so this step is the only one that
      # needed an explicit exclusion.
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: (cd go-host && gofmt -w .) then re-check nothing under vendor/ was touched"
            exit 1
          fi

      - name: go vet
        run: go vet -mod=vendor ./...

      - name: go build
        run: go build -mod=vendor ./...

      - name: go test
        run: go test -mod=vendor ./... -v

      - name: go test -race
        run: go test -mod=vendor -race ./...

  # Repository rules require exact `ci`; always run it so matrix and
  # go-host failures both remain blocking.
  ci:
    if: always()
    needs: [test, go-host]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.go-host.result }}" = success

  # ---------------------------------------------------------------------
  # Report-only jobs (P9-01 / release-readiness.md §2, §6): these run on
  # every PR and their results are visible on the PR, but none of them is
  # in the `ci` gate's `needs:` list above, so a finding here never blocks
  # a merge — matching this project's own standing decision ("running a
  # check and requiring a check to pass before merge are different
  # things... branch protection stays deferred to Milestone E/F"). Promote
  # any of these to `needs: [test, go-host, <job>]` above once that
  # decision changes.
  # ---------------------------------------------------------------------

  # go-host-os-matrix (Phase 13 pre-launch validation): the required
  # go-host job above proves the kernel builds/vets/tests/races cleanly,
  # but only on ubuntu-latest — every phase close-out's real platform
  # evidence has come from one Linux CI runner plus one real Intel Mac
  # (Phase 5 already found one genuine macOS-only bug this way: a
  # `t.TempDir()`-under-`/var/folders`-symlink false positive in
  # `internal/mount`'s ResolveSymlinks check). This job buys a second,
  # continuous, free data point on macOS and Windows for the platform-
  # independent surface — no Docker involved — so a future bug of that
  # shape gets caught on every PR instead of waiting for the next real-Mac
  # verification pass.
  #
  # Deliberately narrow, and stated honestly rather than oversold:
  #   - No race detector here (go-host above already covers -race, and
  #     reliable cgo/gcc availability for the race detector on
  #     windows-latest is not guaranteed the way it is on ubuntu/macos).
  #   - No Docker-dependent coverage at all. macos-latest runners have no
  #     Docker daemon; windows-latest runners only support Windows
  #     containers, not Linux ones. The two go-ec05-live-docker tests are
  #     gated behind NANOCLAW_EC05_LIVE_DOCKER=1 and skip cleanly when
  #     unset (see that job's own comment below), so a plain `go test`
  #     here never accidentally needs Docker — but that also means this
  #     job says nothing about container-spawn behavior on macOS/Windows.
  #     That evidence still has to come from a real machine (Phase 13's
  #     own Mac/WSL2 test tasks), not from CI.
  #   - shell: bash is set explicitly on every step, since windows-latest's
  #     default shell is pwsh and the gofmt/grep pattern below (matching
  #     the required go-host job's own vendor/ exclusion) needs bash.
  go-host-os-matrix:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: go-host
        shell: bash
    steps:
      # windows-latest defaults to core.autocrlf=true, which rewrites every
      # checked-out file's LF endings to CRLF before any step runs. gofmt's
      # canonical output is LF-only, so without this every file gets flagged
      # as "unformatted" purely from the checkout, not real drift (found via
      # a real CI run: the first version of this job failed exactly this way
      # on windows-latest while ubuntu-latest/macos-latest passed clean).
      - name: Preserve LF line endings on checkout (Windows only needs this, harmless elsewhere)
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l . | grep -v -e '^vendor/' -e '^vendor\\' || true)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet -mod=vendor ./...

      - name: go build
        run: go build -mod=vendor ./...

      # go test is deliberately NOT run on windows-latest here. Investigated
      # via a real CI run (2026-09-05): every windows-only test failure traced
      # back to internal/mount's hostPathCanonical, which requires a leading
      # '/' -- a byte-for-byte port of NanoClaw's own upstream TypeScript
      # (types.ts:501-505), not a Go-side bug. Real host data-directory paths
      # (policy.DataRoot/GroupsRoot/MaterialsRoot) are POSIX by design,
      # because NanoClaw itself has never targeted native Windows hosts --
      # this kernel faithfully inherits that, per this project's own
      # reproduce-before-optimizing discipline (LAW-06). Running go test here
      # would just fail on the kernel correctly rejecting non-POSIX paths,
      # not surface a real defect. Windows users are expected to run under
      # WSL2 (a real POSIX environment), same as plain NanoClaw would need.
      - name: go test
        if: matrix.os != 'windows-latest'
        run: go test -mod=vendor ./... -v

  go-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: go-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      # golangci-lint-action v6 only knows how to run golangci-lint v1.x —
      # "version: latest" below silently capped at v1.64.8, the last v1
      # release, which is built with go1.24 and refuses to lint a module
      # whose go.mod targets go1.25 ("the Go language version (go1.24) used
      # to build golangci-lint is lower than the targeted Go version"),
      # exit code 3. v9 runs golangci-lint v2.x (built with go1.27+, so
      # go1.25 modules lint fine) — .golangci.yml already targets the v2
      # config schema (`version: "2"`), so no config migration is needed.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go-host
          args: --timeout=5m

  go-vulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: go-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # govulncheck has no -mod flag at all (unlike go build/vet/test) —
      # passing one is a hard "flag provided but not defined" error, exit
      # code 2. Go auto-detects and uses vendor/ by default whenever it's
      # present and go.mod's go directive is >= 1.14 (true here), so no
      # flag is needed to get the same vendored, network-free analysis.
      - name: govulncheck
        run: govulncheck ./...

  # semgrep scope (2026-09-04): narrowed to go-host/ — the code this project
  # actually owns and ports — dropping src/ from the scan target. src/ is
  # the largely upstream-inherited TypeScript host (see go-host/README.md's
  # own "Thesis": "Everything above the boundary... stays TypeScript"), and
  # scanning it here surfaced 148 findings — mostly the path-traversal audit
  # rule firing on path.join() calls built from already-validated internal
  # identifiers, but also at least one XSS-shaped finding in
  # webhook-server.ts — that this project has never triaged. That's real,
  # separate work (not a CI-hardening regression: these predate this
  # phase's own changes), tracked as an open follow-up rather than silently
  # dropped — same reasoning already used to exclude vendor/ from the
  # gofmt check above ("this project does not reformat code it does not
  # own"). Promote src/ back into scope once that triage happens.
  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: semgrep scan
        run: semgrep scan --config auto --error go-host/

  # go-fuzz-smoke (P9-06, Phase 9/10 hardening): a short, time-boxed real
  # fuzzing run (mutation-guided, `-fuzz=`, not just the seed corpus) for
  # each of P9-02's 5 targets, on every PR. Closes a real gap the release
  # gate checklist (docs/release-gate-checklist.md) named: the `go-host`
  # job's plain `go test ./...` already runs every fuzz target's seed
  # corpus as ordinary subtests (catches known-bad regressions), but never
  # exercises the mutation engine itself — this job is the difference
  # between "the fuzz tests exist" and "fuzzing actually runs in CI".
  # Report-only (continue-on-error, not in the `ci` gate's needs:) for the
  # same reason as go-lint/go-vulncheck/semgrep: a short fuzz budget can
  # legitimately find nothing on a given run, and a flaky-timing failure
  # here should never block a merge — a genuine crash gets a saved
  # `testdata/fuzz/<name>/<hash>` corpus entry committed as a real
  # regression test instead (this project's existing practice; see
  # internal/mount/fuzz_test.go's own doc comment). FuzzDispatch
  # (internal/kernel) needs the vendored sqlite dependency chain like the
  # rest of that package — included here since this job, like `go-host`
  # above, already runs with `-mod=vendor` against the checked-in vendor/.
  go-fuzz-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: go-host
    strategy:
      matrix:
        target:
          - { pkg: "./internal/mount/", name: "FuzzValidateSpec" }
          - { pkg: "./internal/ownership/", name: "FuzzValidateID" }
          - { pkg: "./internal/ownership/", name: "FuzzSafeMailboxPath" }
          - { pkg: "./internal/containerdefaults/", name: "FuzzEnforceSafeDefaults" }
          - { pkg: "./internal/guardpolicy/", name: "FuzzDecideRestartLike" }
          - { pkg: "./internal/kernel/", name: "FuzzDispatch" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      - name: fuzz ${{ matrix.target.name }} for 20s
        run: go test -mod=vendor ${{ matrix.target.pkg }} -run '^$' -fuzz '${{ matrix.target.name }}$' -fuzztime=20s

  # go-ec05-live-docker (EC-05, Phase 9, ADR-018): the two live-Docker
  # adversarial tests from go-host/internal/kernel/adversarial_live_docker_test.go
  # — the ones that actually run the real dockerExecutor against a real
  # Docker daemon (creating a container, mounting the host's Docker socket
  # into it per ADR-018's headline finding, confirming via `docker inspect`,
  # then tearing it down) rather than only proving the validation layer
  # allows it. The 14 in-process EC-05 tests in adversarial_test.go need no
  # separate job at all — they're ordinary Go tests in package kernel, so
  # the required `go-host` job's `go test -mod=vendor ./... -v` above
  # already runs them on every PR.
  #
  # These two are opted out of that job on purpose: they're gated behind
  # NANOCLAW_EC05_LIVE_DOCKER=1 (skip cleanly otherwise — see
  # adversarial_live_docker_test.go's own requireLiveDocker helper) because
  # they have real side effects (create/destroy an actual container) that
  # the rest of this package's tests never do, so a plain `go test ./...`
  # run — local or in `go-host` above — must never trigger them by
  # accident. GitHub-hosted ubuntu-latest runners ship Docker pre-installed
  # and running, so no extra setup step is needed here, unlike a
  # locally-hosted or minimal runner.
  #
  # Report-only (continue-on-error: true, not in the `ci` gate's needs:),
  # same reasoning as go-fuzz-smoke just above: a real container
  # create/inspect/destroy cycle against a shared runner's Docker daemon is
  # inherently more failure-prone (image pull flakiness, runner Docker
  # version/config drift) than an in-process unit test, and this pass's own
  # purpose is to catch and loudly report a regression in either direction —
  # the mount either becomes newly blocked (ADR-018's "FINDING NOT
  # REPRODUCED (good, but re-check this test)" message, meaning someone
  # should update this ADR) or stays open (the current, documented state) —
  # neither outcome should silently block an unrelated PR's merge.
  go-ec05-live-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: go-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      - name: EC-05 live-Docker adversarial tests
        env:
          NANOCLAW_EC05_LIVE_DOCKER: "1"
        run: go test -mod=vendor ./internal/kernel/... -run TestLive -v

  # upstream-watch (P9-05, Phase 9/10 hardening): "CI obtains a pinned/
  # current NanoClaw upstream revision, runs baseline contracts and
  # compares Go behavior; alert on schema/contract drift" — the automated
  # half of docs/baseline.md's "Upstream watch" section and
  # docs/version-compatibility.md's compatibility-review process.
  #
  # Deliberately narrow scope: this job does NOT clone nanocoai/nanoclaw,
  # rebuild it, or run its test suite against this project's Go behavior —
  # that would need real upstream checkout/build infrastructure this
  # project doesn't have yet, and would turn a lightweight weekly signal
  # into a heavy, flaky job (the exact "running a check and requiring a
  # check to pass are different things" distinction this file's own
  # go-lint/go-vulncheck/semgrep comment already draws). What it DOES do:
  # ask GitHub's public release API for nanocoai/nanoclaw's latest tag and
  # compare it against docs/upstream-pin.json's recorded pin — the same
  # "is main ahead of our baseline" question docs/baseline.md's author
  # already answered by hand on 2026-08-29 and 2026-09-03, now asked on a
  # schedule instead of only when someone remembers to. A mismatch is not
  # a failure of THIS project — continue-on-error: true, same as every
  # other report-only job above — it is a prompt for a human to run the
  # review docs/version-compatibility.md describes and, if warranted,
  # promote a new pin (update docs/baseline.md and docs/upstream-pin.json
  # together, per that file's own header comment).
  #
  # Not yet run against the real network from this project's own
  # development sandbox (network egress to api.github.com is blocked
  # there — see go-host/README.md's own "Building and testing" caveats
  # about proxy.golang.org/github.com); written from GitHub's documented
  # public releases API shape and verified for shell/jq correctness, but
  # its first live run will be either on the user's Mac (`gh api
  # repos/nanocoai/nanoclaw/releases/latest`) or in CI itself — the same
  # "correct by careful reading, confirmed on real infrastructure" posture
  # already applied to govulncheck/semgrep above.
  upstream-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compare latest nanocoai/nanoclaw release against the pinned baseline
        run: |
          set -euo pipefail
          pinned_tag="$(jq -r .tag docs/upstream-pin.json)"
          pinned_commit="$(jq -r .commit docs/upstream-pin.json)"
          latest_tag="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nanocoai/nanoclaw/releases/latest \
            | jq -r .tag_name)"

          echo "Pinned baseline:  $pinned_tag ($pinned_commit)"
          echo "Latest upstream:  $latest_tag"

          if [ "$latest_tag" != "$pinned_tag" ]; then
            echo "::warning title=Upstream release drift::nanocoai/nanoclaw has released $latest_tag, but this project's pin (docs/upstream-pin.json, docs/baseline.md) is still $pinned_tag. Run the upstream-compatibility review in go-host/docs/version-compatibility.md before relying on parity fixtures or ADR-cited upstream line numbers against the new release."
          else
            echo "Up to date with the pinned baseline's tag — no review needed on tag alone. (This does not check unreleased commits on upstream main; see docs/baseline.md's own 'Upstream watch' section for that slower-moving, human-run check.)"
          fi
