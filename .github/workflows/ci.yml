name: CI

on:
  pull_request:
    branches: [main]
  # P9-05 (Phase 9/10 hardening): the upstream-watch job below needs its own
  # trigger, independent of this repo's own PR cadence — a new nanocoai/
  # nanoclaw release can land on any day, PR or not. Weekly is deliberately
  # loose (this is a "time for a human to look" signal, not a build gate;
  # see docs/version-compatibility.md) with workflow_dispatch for an
  # on-demand check (e.g. right after a Discord/release announcement).
  schedule:
    - cron: "0 13 * * 1" # every Monday, 13:00 UTC
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      # Typecheck host uses a CI-only config (tsconfig.ci.json) that
      # excludes 3 files with pre-existing TypeScript errors (31 total,
      # all TS2783/TS2322 spread-then-explicit-property mismatches,
      # confirmed via a real `pnpm exec tsc --noEmit` run on 2026-09-03):
      # src/differential/fixtures.test.ts, fixtures-batch2.test.ts, and
      # fixtures-channel-registration.test.ts. These are not part of the
      # recorded upstream baseline (docs/baseline.md's P0-09 shows a
      # clean `tsc --noEmit` at v2.3.0) — they were introduced later by
      # this project's own differential-parity fixtures. This scopes the
      # CI gate around known, tracked debt rather than fixing or
      # silently widening it; the base tsconfig.json (and therefore
      # local/IDE type-checking) is untouched, so these errors stay
      # visible to anyone working in an editor or running
      # `pnpm exec tsc --noEmit` directly. See tsconfig.ci.json's own
      # header comment for the full rationale.
      - name: Typecheck host
        run: pnpm exec tsc -p tsconfig.ci.json --noEmit

      - name: Typecheck container
        run: pnpm exec tsc -p container/agent-runner/tsconfig.json --noEmit

      # Host tests uses a CI-only vitest config (vitest.config.ci.ts).
      # It used to exclude 2 files carried over from upstream's own
      # recorded baseline failures; both were root-caused and confirmed
      # fixed/non-reproducing on this fork (2026-09-20) and the exclusion
      # was removed. See vitest.config.ci.ts's own header comment for the
      # full history and root-cause detail.
      - name: Host tests
        run: pnpm exec vitest run --config vitest.config.ci.ts

      - name: Container tests
        working-directory: container/agent-runner
        run: bun test

  # go-host (Phase 9/10, P9-01): standard Go CI checks — build, vet, test,
  # and the race detector — for the Go security kernel under go-host/. Kept
  # as a REQUIRED job (part of the `ci` gate below) because build/vet/test
  # failures here mean the trust kernel itself is broken, not a style nit.
  # Uses the checked-in vendor/ directory (`-mod=vendor`, matching every
  # `go build`/`go test` this project's own task close-outs have always run
  # by hand on the real Mac) so CI never depends on module-proxy
  # availability. Local equivalent, from go-host/:
  #   gofmt -l .
  #   go vet -mod=vendor ./...
  #   go build -mod=vendor ./...
  #   go test -mod=vendor ./... -v
  #   go test -mod=vendor -race ./...
  go-host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod

      # gofmt check is scoped to this project's own files, excluding
      # vendor/. Vendored third-party sources are not expected to match
      # this repo's own gofmt formatting (confirmed here after the first
      # real CI run found genuine, pre-existing gofmt findings inside
      # vendor/github.com/google/uuid, vendor/github.com/mattn/go-isatty,
      # and vendor/github.com/remyoudompheng/bigfft) and this project does
      # not reformat code it does not own. go vet/build/test below already
      # only cover this project's own packages (module-mode "./..." never
      # expands into vendor/ regardless), so this step is the only one that
      # needed an explicit exclusion.
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: (cd go-host && gofmt -w .) then re-check nothing under vendor/ was touched"
            exit 1
          fi

      - name: go vet
        run: go vet -mod=vendor ./...

      - name: go build
        run: go build -mod=vendor ./...

      - name: go test
        run: go test -mod=vendor ./... -v

      - name: go test -race
        run: go test -mod=vendor -race ./...

  # performance-gate: follow-up from commit 8cbf15db (fix(router): bound
  # engage_pattern regex test against ReDoS) — that fix's own regression
  # test (src/router-engage-pattern-redos.test.ts) already runs inside the
  # `test` job above, mixed in with ~3,900 other tests. That's enough to
  # catch a straight revert, but a genuine latency regression (the vm
  # timeout budget creeping up, or a new call path bypassing
  # safeEngagePatternTest entirely) has no clearly-labeled signal on a PR —
  # it's one green checkmark among many, easy to miss if the assertion
  # itself is loosened in the same PR that regresses it.
  #
  # Scoped to the whole project — TypeScript host, Bun container, and the Go
  # kernel — not just that one test: rather than hardcoding a file list
  # (which silently stops covering new performance-bounding tests the
  # moment someone forgets to also edit this workflow), this job greps all
  # three trees — src/ (host, vitest), container/agent-runner/src/
  # (container, bun), and go-host/ (kernel, go test) — for a `PERF-GATE:`
  # marker in the test's own doc comment, and runs whatever it finds. Any
  # test asserting a wall-clock upper bound — to guard against a hang/DoS
  # class of regression, OR to catch a genuine latency regression on a hot
  # path — should carry that tag; see src/router-engage-pattern-redos.test.ts
  # for the original convention, and router-happy-path-perf.test.ts (host),
  # write-poll-perf.test.ts (container), dispatch_perf_test.go (kernel
  # dispatch), and spawn_perf_test.go (real Docker container spawn/teardown
  # via dockerExecutor — the actual code path every session container is
  # launched through, since TS no longer builds docker create/start argv
  # at all) for the current examples covering "did maintaining this fork
  # make it slower" on each layer's hottest path. Tag a new one and it's
  # picked up automatically, no workflow edit needed.
  #
  # Each tree's discovery step logs the files it found and degrades to a
  # no-op (not a failure) when a tree has zero tagged files — a real,
  # visible gap (the step's own log line says so on every run), not a
  # silent one; failing the whole job over an empty tree would only teach
  # people to delete this job the first time a tree legitimately has
  # nothing to tag yet.
  #
  # Required (part of the `ci` gate's needs below), not report-only: the
  # underlying risk class — an unbounded operation freezing the
  # single-threaded host, a container hang, or an unnoticed hot-path
  # regression on the layer every message pays for — is worth blocking a
  # merge over, not just reporting.
  #
  # Every PERF-GATE-tagged test also logs a `PERF-RESULT: name="..."
  # elapsed_ms=N budget_ms=N` marker (before its own budget assertion, so
  # it's logged even on a failing run — see each test file's own comment).
  # This job's three test-running steps tee their output into
  # $RUNNER_TEMP/perf-{host,container,kernel}.log, and the final
  # "Performance-gate report" step (if: always(), so it runs even after an
  # earlier failure) greps those markers out and writes a results-vs-budget
  # table to the run's own summary page — no digging through raw step logs
  # needed to see what actually ran and by how much margin.
  performance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      - run: pnpm install --frozen-lockfile
      - name: Install agent-runner deps (Bun)
        working-directory: container/agent-runner
        run: bun install --frozen-lockfile

      - name: Host performance-bounding regression tests
        run: |
          set -eo pipefail
          files="$(grep -rl --include='*.test.ts' 'PERF-GATE:' src || true)"
          if [ -z "$files" ]; then
            echo "::warning::No PERF-GATE-tagged test files found under src/ — host-side performance gate has nothing to run."
            exit 0
          fi
          echo "Tagged host test files:"
          echo "$files"
          # --reporter=verbose (not the default reporter) so the
          # PERF-RESULT console.log lines actually show up in captured
          # output on a PASSING run — vitest's default reporter only
          # surfaces a test's console output when it fails, which would
          # silently break the report step below for the common case.
          #
          # --no-file-parallelism: vitest's default pool runs each test
          # file in its own forked process, in parallel, sharing whatever
          # CPU the runner has. For ordinary correctness tests that's a
          # pure speed win with no downside — but for a WALL-CLOCK TIMING
          # assertion, two files genuinely competing for CPU at the same
          # moment is real, uncontrolled noise on top of whatever the
          # test is trying to measure. Confirmed locally: running these
          # two files in parallel gave a 383-546ms range (43% spread);
          # sequential gave 306-330ms (8% spread) for the exact same
          # test. A real CI run hit 3350ms against a 1500ms budget before
          # this flag was added — root-caused to this contention, not a
          # real regression, and not something a bigger budget number
          # actually fixes at the source.
          echo "$files" | xargs pnpm exec vitest run --config vitest.config.ci.ts --reporter=verbose --no-file-parallelism | tee "${RUNNER_TEMP}/perf-host.log"

      - name: Container performance-bounding regression tests
        working-directory: container/agent-runner
        run: |
          set -eo pipefail
          files="$(grep -rl --include='*.test.ts' 'PERF-GATE:' src || true)"
          if [ -z "$files" ]; then
            echo "No PERF-GATE-tagged test files found under container/agent-runner/src/ — nothing to run yet."
            exit 0
          fi
          echo "Tagged container test files:"
          echo "$files"
          echo "$files" | xargs bun test | tee "${RUNNER_TEMP}/perf-container.log"

      # Go tests don't run "by file" from the command line the way
      # vitest/bun do — `go test` matches by function name (`-run`) within
      # a package. So this step greps for tagged files same as the other
      # two, then extracts each file's exported Test* function names to
      # build the -run pattern, scoped to that file's own package
      # directory (a tagged file's untagged sibling tests in the same
      # package are deliberately excluded from the pattern, not just left
      # to also run for free — keeps this job's runtime independent of
      # how many ordinary tests happen to share the same package).
      # NANOCLAW_PERF_LIVE_DOCKER=1 opts spawn_perf_test.go's
      # TestContainerSpawnPerfBudget into actually running (it skips
      # cleanly without this, same convention as EC-05's/egress's own
      # live-Docker opt-ins) — set here, not globally, so a plain
      # `go test ./...` never spins up a real container outside this one
      # CI step. GitHub-hosted ubuntu-latest runners ship Docker
      # pre-installed and running already (see this file's go-ec05-live-docker
      # job comment for the same fact), so no extra Docker setup step is
      # needed before this.
      - name: Kernel (Go) performance-bounding regression tests
        working-directory: go-host
        env:
          NANOCLAW_PERF_LIVE_DOCKER: "1"
        run: |
          set -eo pipefail
          files="$(grep -rl --include='*_test.go' 'PERF-GATE:' . | grep -v '^\./vendor/' || true)"
          if [ -z "$files" ]; then
            echo "No PERF-GATE-tagged test files found under go-host/ — nothing to run yet."
            exit 0
          fi
          echo "Tagged kernel test files:"
          echo "$files"
          # `while read` line-at-a-time, not an unquoted `for f in $files`
          # word-split loop — the latter only reliably splits on newlines
          # under bash's default IFS; this way is correct regardless of
          # the invoking shell's word-splitting behavior.
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            dir="$(dirname "$f")"
            names="$(grep -oE '^func (Test[A-Za-z0-9_]+)' "$f" | awk '{print $2}' | paste -sd'|' -)"
            if [ -z "$names" ]; then
              echo "::error::$f carries the PERF-GATE: tag but no exported Test* function was found in it"
              exit 1
            fi
            echo "=== $dir: $names ==="
            go test -mod=vendor "./$dir" -run "^($names)\$" -v | tee -a "${RUNNER_TEMP}/perf-kernel.log"
          done <<< "$files"

      # Runs regardless of whether the three steps above passed, failed, or
      # were no-ops (each only writes its own log file if it actually ran
      # something — a tree with zero tagged files never reaches its `tee`,
      # so that log file legitimately won't exist, handled below) — a
      # failing PERF-GATE test still logs its PERF-RESULT line before the
      # assertion that fails it (see each test file's own comment on why),
      # so the report reflects what actually happened even on a red run,
      # not just the last thing that happened before a failure stopped a
      # step early.
      - name: Performance-gate report
        if: always()
        run: |
          set -eo pipefail
          {
            echo "## Performance gate results"
            echo
            echo "| Layer | Check | Elapsed | Budget | Margin |"
            echo "|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          found_any=0
          for log in "${RUNNER_TEMP}/perf-host.log" "${RUNNER_TEMP}/perf-container.log" "${RUNNER_TEMP}/perf-kernel.log"; do
            [ -f "$log" ] || continue
            while IFS= read -r line; do
              found_any=1
              name="$(echo "$line" | sed -E 's/.*name="([^"]+)".*/\1/')"
              elapsed="$(echo "$line" | sed -E 's/.*elapsed_ms=([0-9]+).*/\1/')"
              budget="$(echo "$line" | sed -E 's/.*budget_ms=([0-9]+).*/\1/')"
              if [ "$elapsed" -gt 0 ] 2>/dev/null; then
                margin="$(awk "BEGIN{printf \"%.1fx\", $budget/$elapsed}")"
              else
                margin="n/a"
              fi
              gate_status="✅"
              [ "$elapsed" -gt "$budget" ] 2>/dev/null && gate_status="❌"
              echo "| $gate_status | $name | ${elapsed}ms | ${budget}ms | $margin |" >> "$GITHUB_STEP_SUMMARY"
            done < <(grep -oE 'PERF-RESULT:.*' "$log" || true)
          done

          if [ "$found_any" -eq 0 ]; then
            echo "| — | *(no PERF-GATE-tagged tests ran)* | — | — | — |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Budgets are fixed ceilings tuned against real GitHub Actions runner measurements, not a %-vs-baseline comparison — see each test file's own comment for the baseline this was set against." >> "$GITHUB_STEP_SUMMARY"

  # Repository rules require exact `ci`; always run it so matrix, go-host,
  # pnpm-audit, and performance-gate failures all remain blocking.
  ci:
    if: always()
    needs: [test, go-host, pnpm-audit, performance-gate]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.go-host.result }}" = success
          test "${{ needs.pnpm-audit.result }}" = success
          test "${{ needs.performance-gate.result }}" = success

  # ---------------------------------------------------------------------
  # Report-only jobs (P9-01 / release-readiness.md §2, §6): these run on
  # every PR and their results are visible on the PR, but (pnpm-audit
  # excepted — promoted into the gate 2026-09-20, see its own comment
  # below) none of the rest is in the `ci` gate's `needs:` list above, so
  # a finding there never blocks a merge — matching this project's own
  # standing decision ("running a check and requiring a check to pass
  # before merge are different things... branch protection stays deferred
  # to Milestone E/F"). Promote any of these to
  # `needs: [test, go-host, <job>]` above once that decision changes —
  # pnpm-audit is the precedent: only worth doing once a job fails on
  # genuine regressions rather than permanently-known noise.
  # ---------------------------------------------------------------------

  # go-host-os-matrix (Phase 13 pre-launch validation): the required
  # go-host job above proves the kernel builds/vets/tests/races cleanly,
  # but only on ubuntu-latest — every phase close-out's real platform
  # evidence has come from one Linux CI runner plus one real Intel Mac
  # (Phase 5 already found one genuine macOS-only bug this way: a
  # `t.TempDir()`-under-`/var/folders`-symlink false positive in
  # `internal/mount`'s ResolveSymlinks check). This job buys a second,
  # continuous, free data point on macOS and Windows for the platform-
  # independent surface — no Docker involved — so a future bug of that
  # shape gets caught on every PR instead of waiting for the next real-Mac
  # verification pass.
  #
  # Deliberately narrow, and stated honestly rather than oversold:
  #   - No race detector here (go-host above already covers -race, and
  #     reliable cgo/gcc availability for the race detector on
  #     windows-latest is not guaranteed the way it is on ubuntu/macos).
  #   - No Docker-dependent coverage at all. macos-latest runners have no
  #     Docker daemon; windows-latest runners only support Windows
  #     containers, not Linux ones. The two go-ec05-live-docker tests are
  #     gated behind NANOCLAW_EC05_LIVE_DOCKER=1 and skip cleanly when
  #     unset (see that job's own comment below), so a plain `go test`
  #     here never accidentally needs Docker — but that also means this
  #     job says nothing about container-spawn behavior on macOS/Windows.
  #     That evidence still has to come from a real machine (Phase 13's
  #     own Mac/WSL2 test tasks), not from CI.
  #   - shell: bash is set explicitly on every step, since windows-latest's
  #     default shell is pwsh and the gofmt/grep pattern below (matching
  #     the required go-host job's own vendor/ exclusion) needs bash.
  go-host-os-matrix:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: go-host
        shell: bash
    steps:
      # windows-latest defaults to core.autocrlf=true, which rewrites every
      # checked-out file's LF endings to CRLF before any step runs. gofmt's
      # canonical output is LF-only, so without this every file gets flagged
      # as "unformatted" purely from the checkout, not real drift (found via
      # a real CI run: the first version of this job failed exactly this way
      # on windows-latest while ubuntu-latest/macos-latest passed clean).
      - name: Preserve LF line endings on checkout (Windows only needs this, harmless elsewhere)
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l . | grep -v -e '^vendor/' -e '^vendor\\' || true)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet -mod=vendor ./...

      - name: go build
        run: go build -mod=vendor ./...

      # go test is deliberately NOT run on windows-latest here. Investigated
      # via a real CI run (2026-09-05): every windows-only test failure traced
      # back to internal/mount's hostPathCanonical, which requires a leading
      # '/' -- a byte-for-byte port of NanoClaw's own upstream TypeScript
      # (types.ts:501-505), not a Go-side bug. Real host data-directory paths
      # (policy.DataRoot/GroupsRoot/MaterialsRoot) are POSIX by design,
      # because NanoClaw itself has never targeted native Windows hosts --
      # this kernel faithfully inherits that, per this project's own
      # reproduce-before-optimizing discipline (LAW-06). Running go test here
      # would just fail on the kernel correctly rejecting non-POSIX paths,
      # not surface a real defect. Windows users are expected to run under
      # WSL2 (a real POSIX environment), same as plain NanoClaw would need.
      - name: go test
        if: matrix.os != 'windows-latest'
        run: go test -mod=vendor ./... -v

  go-lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: go-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      # golangci-lint-action v6 only knows how to run golangci-lint v1.x —
      # "version: latest" below silently capped at v1.64.8, the last v1
      # release, which is built with go1.24 and refuses to lint a module
      # whose go.mod targets go1.25 ("the Go language version (go1.24) used
      # to build golangci-lint is lower than the targeted Go version"),
      # exit code 3. v9 runs golangci-lint v2.x (built with go1.27+, so
      # go1.25 modules lint fine) — .golangci.yml already targets the v2
      # config schema (`version: "2"`), so no config migration is needed.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: go-host
          args: --timeout=5m

  go-vulncheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: go-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # govulncheck has no -mod flag at all (unlike go build/vet/test) —
      # passing one is a hard "flag provided but not defined" error, exit
      # code 2. Go auto-detects and uses vendor/ by default whenever it's
      # present and go.mod's go directive is >= 1.14 (true here), so no
      # flag is needed to get the same vendored, network-free analysis.
      - name: govulncheck
        run: govulncheck ./...

  # pnpm-audit: govulncheck's counterpart for the npm/TypeScript side (found
  # via a manual `pnpm audit` pass, 2026-09-20: 12 unique high/critical
  # advisories — all in devDependencies only, eslint/vitest/vite/tsx's own
  # transitive tree, confirmed via `pnpm audit --prod` returning zero — and
  # all DoS-class, never code-execution).
  #
  # A plain `pnpm audit --audit-level=high` fails on every single run as
  # long as ANY of those 12 known findings exist — permanently red, which
  # buries a genuinely new advisory in noise nobody has a reason to read
  # closely, and makes "just merge, pnpm-audit is always red" the only
  # sane response. scripts/check-pnpm-audit-baseline.ts fixes that: it
  # diffs the current high/critical advisory set against the checked-in
  # .github/pnpm-audit-baseline.txt and fails ONLY on advisories not
  # already accepted there (including a known advisory's severity later
  # getting rescored up — it isn't in the high+ baseline yet, so that's
  # correctly treated as new). That makes this job meaningful again, so
  # — unlike go-vulncheck/go-lint/semgrep above — it's NOT continue-on-error
  # and IS in the `ci` gate's `needs:` list below: a real regression here
  # blocks merge. See that script's own header for the exact mechanics, and
  # the baseline file's header for how to clear or accept an entry.
  pnpm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (new findings only — see comment above)
        run: pnpm exec tsx scripts/check-pnpm-audit-baseline.ts

  # semgrep scope (2026-09-20): src/ promoted back into scope after a full
  # triage of the 149 findings a first pass surfaced here (2026-09-04 note
  # this replaces). Disposition:
  #   - 145 path-traversal findings (path-join-resolve-traversal): all false
  #     positives. Every flagged path.join/resolve call resolves through one
  #     of three validated-provenance sources — resolveLocalTemplate's
  #     containment guard (src/templates/local-dir.ts), the stricter
  #     allowlist-regex + containment guard in resolveGroupFolderPath
  #     (src/group-folder.ts), or a DB-primary-key-resolved session/agent-
  #     group id (never a raw external string at the join site — traced
  #     exhaustively for session-manager.ts and mailbox/sqlite/paths.ts,
  #     closing the gap docs/threat-model-addendum-p5.md §3 had left open).
  #     None of the 145 sites are suppressed inline — they aren't part of
  #     any PR's diff going forward, so a future PR that actually touches
  #     one of them (and breaks the invariant) would surface it fresh.
  #   - 2 detect-child-process findings (src/drivers/cli.ts,
  #     src/modules/kernel-supervisor/index.ts): false positives —
  #     array-form execFileSync/spawn, no shell involved. Marked
  #     `nosemgrep` at each call site with that rationale.
  #   - 1 XSS-shaped finding (webhook-server.ts's direct response write):
  #     real, but already mitigated by the nosniff header added above.
  #     Marked `nosemgrep` at the call site referencing that mitigation.
  #   - 1 non-literal-regexp finding (router.ts's engage_pattern test): no
  #     longer applies — the regex construction now happens inside a
  #     vm-sandboxed string (see safeEngagePatternTest in src/router.ts,
  #     which also fixes the underlying ReDoS gap that finding was
  #     pointing at), which isn't a real RegExp() call in this file's AST
  #     any more.
  # src/ scans in PR-diff-only mode (--baseline-commit) rather than a full
  # rescan every time — with 145 pattern-matches never going away, a full
  # scan would just be permanent noise burying any genuinely new finding.
  # go-host/ (small, project-owned, currently clean) keeps its full scan on
  # every trigger. Non-PR triggers (schedule/workflow_dispatch) have no PR
  # base commit to diff against, so the src/ step only runs on pull_request;
  # go-host/'s full scan still runs on every trigger regardless.
  semgrep:
    runs-on: ubuntu-latest
    continue-on-error: true
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: semgrep scan (go-host, full)
        run: semgrep scan --config auto --error go-host/
      - name: semgrep scan (src, PR-diff only)
        if: github.event_name == 'pull_request'
        run: semgrep scan --config auto --error --baseline-commit "$BASE_SHA" src/
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # go-fuzz-smoke (P9-06, Phase 9/10 hardening): a short, time-boxed real
  # fuzzing run (mutation-guided, `-fuzz=`, not just the seed corpus) for
  # each of P9-02's 5 targets, on every PR. Closes a real gap the release
  # gate checklist (docs/release-gate-checklist.md) named: the `go-host`
  # job's plain `go test ./...` already runs every fuzz target's seed
  # corpus as ordinary subtests (catches known-bad regressions), but never
  # exercises the mutation engine itself — this job is the difference
  # between "the fuzz tests exist" and "fuzzing actually runs in CI".
  # Report-only (continue-on-error, not in the `ci` gate's needs:) for the
  # same reason as go-lint/go-vulncheck/semgrep: a short fuzz budget can
  # legitimately find nothing on a given run, and a flaky-timing failure
  # here should never block a merge — a genuine crash gets a saved
  # `testdata/fuzz/<name>/<hash>` corpus entry committed as a real
  # regression test instead (this project's existing practice; see
  # internal/mount/fuzz_test.go's own doc comment). FuzzDispatch
  # (internal/kernel) needs the vendored sqlite dependency chain like the
  # rest of that package — included here since this job, like `go-host`
  # above, already runs with `-mod=vendor` against the checked-in vendor/.
  go-fuzz-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: go-host
    strategy:
      matrix:
        target:
          - { pkg: "./internal/mount/", name: "FuzzValidateSpec" }
          - { pkg: "./internal/ownership/", name: "FuzzValidateID" }
          - { pkg: "./internal/ownership/", name: "FuzzSafeMailboxPath" }
          - { pkg: "./internal/containerdefaults/", name: "FuzzEnforceSafeDefaults" }
          - { pkg: "./internal/guardpolicy/", name: "FuzzDecideRestartLike" }
          - { pkg: "./internal/kernel/", name: "FuzzDispatch" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      - name: fuzz ${{ matrix.target.name }} for 20s
        run: go test -mod=vendor ${{ matrix.target.pkg }} -run '^$' -fuzz '${{ matrix.target.name }}$' -fuzztime=20s

  # go-ec05-live-docker (EC-05, Phase 9, ADR-018): the two live-Docker
  # adversarial tests from go-host/internal/kernel/adversarial_live_docker_test.go
  # — the ones that actually run the real dockerExecutor against a real
  # Docker daemon (creating a container, mounting the host's Docker socket
  # into it per ADR-018's headline finding, confirming via `docker inspect`,
  # then tearing it down) rather than only proving the validation layer
  # allows it. The 14 in-process EC-05 tests in adversarial_test.go need no
  # separate job at all — they're ordinary Go tests in package kernel, so
  # the required `go-host` job's `go test -mod=vendor ./... -v` above
  # already runs them on every PR.
  #
  # These two are opted out of that job on purpose: they're gated behind
  # NANOCLAW_EC05_LIVE_DOCKER=1 (skip cleanly otherwise — see
  # adversarial_live_docker_test.go's own requireLiveDocker helper) because
  # they have real side effects (create/destroy an actual container) that
  # the rest of this package's tests never do, so a plain `go test ./...`
  # run — local or in `go-host` above — must never trigger them by
  # accident. GitHub-hosted ubuntu-latest runners ship Docker pre-installed
  # and running, so no extra setup step is needed here, unlike a
  # locally-hosted or minimal runner.
  #
  # Report-only (continue-on-error: true, not in the `ci` gate's needs:),
  # same reasoning as go-fuzz-smoke just above: a real container
  # create/inspect/destroy cycle against a shared runner's Docker daemon is
  # inherently more failure-prone (image pull flakiness, runner Docker
  # version/config drift) than an in-process unit test, and this pass's own
  # purpose is to catch and loudly report a regression in either direction —
  # the mount either becomes newly blocked (ADR-018's "FINDING NOT
  # REPRODUCED (good, but re-check this test)" message, meaning someone
  # should update this ADR) or stays open (the current, documented state) —
  # neither outcome should silently block an unrelated PR's merge.
  go-ec05-live-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: go-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      - name: EC-05 live-Docker adversarial tests
        env:
          NANOCLAW_EC05_LIVE_DOCKER: "1"
        run: go test -mod=vendor ./internal/kernel/... -run TestLive -v

  # go-egress-live-docker (ADR-013 Decision 3): the live-Docker test from
  # go-host/internal/egress/live_docker_test.go — the one that actually
  # runs a real privileged helper container against a real Docker daemon,
  # mutates the real DOCKER-USER iptables chain, and confirms via an
  # independent `iptables -C` check (not the package's own Check function)
  # that the cloud-metadata/link-local block is genuinely active. Same
  # shape and rationale as go-ec05-live-docker just below: gated behind
  # NANOCLAW_EGRESS_LIVE_DOCKER=1 so a plain `go test ./...` — here or
  # locally — never mutates a real iptables chain by accident, and
  # report-only (continue-on-error: true, outside the `ci` gate's needs:)
  # since a shared runner's Docker/iptables environment is more
  # failure-prone than an in-process unit test and a flake here should
  # never block an unrelated PR. This mechanism is Linux-only by design
  # (see internal/egress's package doc comment on Docker Desktop for Mac's
  # --network host being a proxy/forwarding emulation, not a real shared
  # network namespace) so this job only needs ubuntu-latest, unlike
  # go-host-os-matrix above.
  go-egress-live-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: go-host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      # Diagnostic-only (never fails the job on its own — every command is
      # best-effort, `|| true`): two live-Docker fix attempts based on
      # externally-documented iptables-nft/legacy split theories both
      # failed to resolve this job's real failure, which means the theory
      # is missing something specific to this runner. Rather than guess a
      # third time, this step prints ground truth directly from the host
      # (not from inside any helper container, so it can't share whatever
      # bug the container-side mechanism has) — which iptables/nft variant
      # the host resolves by default, whether DOCKER-USER exists under
      # either backend already, and Docker's own reported security/network
      # configuration. Read this output first when this job fails again.
      - name: Diagnose host firewall backend (ground truth, not a guess)
        run: |
          echo "--- iptables --version (host) ---"
          iptables --version || true
          echo "--- ip6tables --version (host) ---"
          ip6tables --version || true
          echo "--- nft --version (host) ---"
          nft --version || true
          echo "--- update-alternatives --display iptables (host) ---"
          update-alternatives --display iptables || true
          echo "--- host: iptables -S DOCKER-USER ---"
          sudo iptables -S DOCKER-USER || true
          echo "--- host: nft list chain ip filter DOCKER-USER ---"
          sudo nft list chain ip filter DOCKER-USER || true
          echo "--- host: nft list ruleset (ip filter table only) ---"
          sudo nft list table ip filter || true
          echo "--- docker info (security/network relevant fields) ---"
          docker info --format 'SecurityOptions: {{.SecurityOptions}} | CgroupDriver: {{.CgroupDriver}}' || true
          echo "--- docker version (server) ---"
          docker version --format '{{.Server.Version}}' || true
          echo "--- kernel ---"
          uname -a || true
        continue-on-error: true
      - name: egress live-Docker test (ADR-013 Decision 3)
        env:
          NANOCLAW_EGRESS_LIVE_DOCKER: "1"
        run: go test -mod=vendor ./internal/egress/... -run TestLive -v

  # live-host-docker (EC-07, ADR-023): the live-Docker leg with the
  # TypeScript host in front of it — a line typed at the real CLI adapter's
  # Unix socket, routed by the real router, waking a real container through
  # the real KernelClient → real `nanogo serve` → real Docker daemon, with
  # the reply coming back out of the same socket through the real delivery
  # poll. Runs scripts/ec07-live-host-smoke.sh; see that script and
  # scripts/ec07-live-host-smoke.ts for what is real and what is
  # substituted (a deterministic provider, for the same reason EC-06 used
  # one).
  #
  # Runs on every PR, plus weekly and on demand. That was NOT the original
  # decision. This job was first written as schedule + workflow_dispatch
  # only, on the stated assumption that building the agent image (apt +
  # chromium + bun + pnpm globals) would cost minutes of runner time on
  # every PR. The first dispatched run measured it instead: 69s for the
  # image, 24s for the smoke itself, 105s for the whole job — with no layer
  # caching at all. The estimate had come from the author's laptop, where
  # the same build takes 757s, two thirds of it in export and unpack. Off by
  # an order of magnitude, so the argument for keeping this off PRs went
  # with it. Recorded here rather than quietly corrected, because the
  # original comment made the cost claim explicitly.
  #
  # What this covers that the per-PR jobs do not: the host half of this path
  # is already covered by src/cli-channel-kernel-smoke.test.ts inside the
  # required `test` job, and the kernel half by go-ec05-live-docker above —
  # but until EC-07 nobody ever ran the JOINED path automatically, and EC-06
  # was always a manual re-run on someone's Mac. docs/release-gate-checklist
  # .md rows 5 and 11 also name this job as the thing to dispatch
  # (workflow_dispatch) against an actual release candidate.
  #
  # Report-only, like its neighbours: `continue-on-error: true` and outside
  # the `ci` gate's needs:. A shared runner's Docker environment is more
  # failure-prone than an in-process test, and a flake here should never
  # block an unrelated PR. `timeout-minutes: 45` stays deliberately generous
  # against the measured 105s — the cost is one image build on a runner
  # whose disk and network throughput this project does not control.
  live-host-docker:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-host/go.mod
      - run: pnpm install --frozen-lockfile

      # The agent-runner's own dependencies are installed INSIDE the image
      # (the Dockerfile COPYs package.json + bun.lock and runs bun install),
      # so no host-side bun setup is needed here — unlike the `test` job,
      # which runs the container test suite on the runner itself.
      #
      # The tag is derived from the checkout path by setup/lib/install-slug.sh,
      # and src/config.ts's CONTAINER_IMAGE derives it the same way, so the
      # harness finds this image without being told where it is.
      - name: Build the agent image
        run: ./container/build.sh

      - name: EC-07 live host + kernel + Docker smoke
        run: scripts/ec07-live-host-smoke.sh

      # The harness tears its own containers down through the kernel and its
      # wrapper removes the scratch install, but a run that died between the
      # two leaves a container behind. Named here so a failed run's diagnosis
      # starts from ground truth rather than from an empty `docker ps`.
      - name: What Docker still holds (diagnostic only)
        if: always()
        run: |
          echo "--- containers ---"
          docker ps -a || true
          echo "--- images ---"
          docker images || true

  # upstream-watch (P9-05, Phase 9/10 hardening): "CI obtains a pinned/
  # current NanoClaw upstream revision, runs baseline contracts and
  # compares Go behavior; alert on schema/contract drift" — the automated
  # half of docs/baseline.md's "Upstream watch" section and
  # docs/version-compatibility.md's compatibility-review process.
  #
  # Deliberately narrow scope: this job does NOT clone nanocoai/nanoclaw,
  # rebuild it, or run its test suite against this project's Go behavior —
  # that would need real upstream checkout/build infrastructure this
  # project doesn't have yet, and would turn a lightweight weekly signal
  # into a heavy, flaky job (the exact "running a check and requiring a
  # check to pass are different things" distinction this file's own
  # go-lint/go-vulncheck/semgrep comment already draws). What it DOES do:
  # ask GitHub's public release API for nanocoai/nanoclaw's latest tag and
  # compare it against docs/upstream-pin.json's recorded pin — the same
  # "is main ahead of our baseline" question docs/baseline.md's author
  # already answered by hand on 2026-08-29 and 2026-09-03, now asked on a
  # schedule instead of only when someone remembers to. A mismatch is not
  # a failure of THIS project — continue-on-error: true, same as every
  # other report-only job above — it is a prompt for a human to run the
  # review docs/version-compatibility.md describes and, if warranted,
  # promote a new pin (update docs/baseline.md and docs/upstream-pin.json
  # together, per that file's own header comment).
  #
  # Not yet run against the real network from this project's own
  # development sandbox (network egress to api.github.com is blocked
  # there — see go-host/README.md's own "Building and testing" caveats
  # about proxy.golang.org/github.com); written from GitHub's documented
  # public releases API shape and verified for shell/jq correctness, but
  # its first live run will be either on the user's Mac (`gh api
  # repos/nanocoai/nanoclaw/releases/latest`) or in CI itself — the same
  # "correct by careful reading, confirmed on real infrastructure" posture
  # already applied to govulncheck/semgrep above.
  upstream-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compare latest nanocoai/nanoclaw release against the pinned baseline
        run: |
          set -euo pipefail
          pinned_tag="$(jq -r .tag docs/upstream-pin.json)"
          pinned_commit="$(jq -r .commit docs/upstream-pin.json)"
          latest_tag="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/nanocoai/nanoclaw/releases/latest \
            | jq -r .tag_name)"

          echo "Pinned baseline:  $pinned_tag ($pinned_commit)"
          echo "Latest upstream:  $latest_tag"

          if [ "$latest_tag" != "$pinned_tag" ]; then
            echo "::warning title=Upstream release drift::nanocoai/nanoclaw has released $latest_tag, but this project's pin (docs/upstream-pin.json, docs/baseline.md) is still $pinned_tag. Run the upstream-compatibility review in go-host/docs/version-compatibility.md before relying on parity fixtures or ADR-cited upstream line numbers against the new release."
          else
            echo "Up to date with the pinned baseline's tag — no review needed on tag alone. (This does not check unreleased commits on upstream main; see docs/baseline.md's own 'Upstream watch' section for that slower-moving, human-run check.)"
          fi

  # egress-image-watch (maintenance follow-up to ADR-013's digest pin,
  # go-host/docs/version-compatibility.md §5): the DOCKER-USER helper
  # container (internal/egress's helperImage) is pinned by exact manifest
  # digest, not a floating tag — deliberately, so every install runs
  # exactly the reviewed bits on this project's single most privileged
  # container. The trade-off that discipline accepts is that a pinned
  # digest does NOT receive Alpine's routine security patches automatically
  # the way a floating tag would. This job is the automated "detect" half
  # of the policy that keeps that pin from silently going stale: same
  # cadence and posture as upstream-watch above (weekly + on-demand,
  # report-only, continue-on-error: true) — a mismatch here is not a
  # failure of this project, it's a prompt for a human to run
  # version-compatibility.md §5's review/decide/promote steps. Also meant
  # to be triggered manually (workflow_dispatch) before cutting a nanogo
  # release, per that same section, since a release is otherwise the one
  # natural checkpoint nothing else would prompt someone to use.
  egress-image-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compare the live alpine:3.20 digest against the pinned helper-image digest
        run: |
          set -euo pipefail
          pinned_digest="$(grep -oE 'sha256:[0-9a-f]{64}' go-host/internal/egress/egress.go | head -1)"
          if [ -z "$pinned_digest" ]; then
            echo "::error title=No pinned digest found::Could not find a sha256:... digest in go-host/internal/egress/egress.go's helperImage const. This job's own grep pattern may be out of sync with that file."
            exit 1
          fi

          docker pull alpine:3.20 >/dev/null
          live_digest="$(docker inspect --format='{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' alpine:3.20 \
            | grep -oE 'sha256:[0-9a-f]{64}' | head -1)"

          echo "Pinned digest (egress.go):      $pinned_digest"
          echo "Live alpine:3.20 digest (Hub):  $live_digest"

          if [ "$live_digest" != "$pinned_digest" ]; then
            echo "::warning title=Egress helper image drift::alpine:3.20 on Docker Hub now resolves to $live_digest, but internal/egress/egress.go still pins $pinned_digest. This is not necessarily urgent (a pin intentionally does not auto-update) — run the review/decide/promote steps in go-host/docs/version-compatibility.md §5 before re-pinning."
          else
            echo "Up to date — the pinned digest still matches the live alpine:3.20 tag."
          fi
